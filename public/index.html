<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>Vortex OS</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/vendor/xterm.css">
  <link rel="stylesheet" href="/css/vortex.css">
</head>
<body>
  <!-- Boot splash -->
  <div id="boot" class="boot">
    <img src="/img/logo.svg" alt="" class="boot-logo">
    <div class="boot-title">VORTEX<span>OS</span></div>
    <div class="boot-bar"><i></i></div>
    <div class="boot-msg" id="boot-msg">Waking the hive…</div>
  </div>

  <!-- Login -->
  <main id="login" class="login hidden" aria-label="Sign in">
    <form id="login-form" class="login-card" autocomplete="on">
      <img src="/img/logo.svg" alt="" class="login-logo">
      <h1>Vortex OS</h1>
      <p class="login-hive" id="login-hive">MNX Hive</p>
      <label>Bee name
        <input name="username" autocomplete="username" required autocapitalize="none" spellcheck="false" maxlength="32">
      </label>
      <label>Password
        <input name="password" type="password" autocomplete="current-password" required maxlength="256">
      </label>
      <p class="form-error" id="login-error" role="alert"></p>
      <button type="submit" class="btn primary wide">Enter the hive</button>
      <p class="login-foot">🛡️ Protected by Hive Guard · sessions are audited</p>
    </form>
  </main>

  <!-- Forced password change -->
  <main id="pwchange" class="login hidden" aria-label="Change password">
    <form id="pwchange-form" class="login-card">
      <img src="/img/logo.svg" alt="" class="login-logo">
      <h1>New password</h1>
      <p class="login-hive">Your queen gave you a one-time password. Choose your own to continue.</p>
      <label>Current password <input name="current" type="password" autocomplete="current-password" required></label>
      <label>New password <input name="next" type="password" autocomplete="new-password" required minlength="10"></label>
      <label>Repeat new password <input name="repeat" type="password" autocomplete="new-password" required minlength="10"></label>
      <p class="hint">At least 10 characters, with 3 of: lowercase, uppercase, digit, symbol.</p>
      <p class="form-error" id="pwchange-error" role="alert"></p>
      <button type="submit" class="btn primary wide">Save &amp; continue</button>
    </form>
  </main>

  <!-- Desktop -->
  <div id="desktop" class="desktop hidden">
    <header class="topbar">
      <button class="topbar-brand" id="launcher-btn" aria-haspopup="true" title="Applications">
        <img src="/img/logo.svg" alt=""> <span>Vortex</span>
      </button>
      <div class="topbar-active" id="active-title"></div>
      <div class="topbar-right">
        <span class="chip guard" id="guard-chip" title="Hive Guard is protecting this session">🛡️ Guard</span>
        <span class="chip" id="stat-chip" title="CPU / memory"></span>
        <span class="clock" id="clock"></span>
        <button class="user-btn" id="user-btn" aria-haspopup="true"></button>
      </div>
    </header>

    <div class="desk-icons" id="desk-icons"></div>
    <div class="windows" id="windows"></div>

    <nav class="dock" id="dock" aria-label="Dock"></nav>

    <div class="launcher hidden" id="launcher" role="dialog" aria-label="Applications">
      <input id="launcher-search" placeholder="Search apps…" autocomplete="off" spellcheck="false">
      <div class="launcher-grid" id="launcher-grid"></div>
    </div>

    <div class="menu hidden" id="user-menu" role="menu"></div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="/vendor/xterm.js"></script>
  <script src="/vendor/addon-fit.js"></script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
