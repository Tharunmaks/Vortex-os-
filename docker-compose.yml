# Vortex OS for the MNX Hive.
#   docker compose up -d --build            → http://127.0.0.1:8420
#   docker compose --profile https up -d     → https://$VORTEX_DOMAIN (automatic TLS via Caddy)
services:
  vortex:
    build: .
    image: mnx/vortex-os:latest
    hostname: vortex
    restart: unless-stopped
    ports:
      - "127.0.0.1:8420:8420" # loopback only; use the https profile to expose publicly
    environment:
      VORTEX_HIVE_NAME: "MNX Hive"
      # VORTEX_ADMIN_PASSWORD: "set-a-strong-one"  # otherwise a one-time password is printed to the logs
      VORTEX_SECURE_COOKIES: "${VORTEX_SECURE_COOKIES:-0}"
      VORTEX_TRUST_PROXY: "${VORTEX_TRUST_PROXY:-0}"
    volumes:
      - vortex-data:/var/lib/vortex
    # ── Hardening: the real security boundary ──
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /home/bee:size=64m,uid=10001,gid=10001
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 2g
    cpus: 2.0
    ulimits:
      nofile: { soft: 4096, hard: 8192 }

  caddy:
    profiles: ["https"]
    image: caddy:2
    restart: unless-stopped
    depends_on: [vortex]
    ports: ["80:80", "443:443"]
    environment:
      VORTEX_DOMAIN: "${VORTEX_DOMAIN:?set VORTEX_DOMAIN to your hostname}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]

volumes:
  vortex-data:
  caddy-data:
